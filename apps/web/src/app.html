<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="%sveltekit.assets%/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="theme-color" content="#050C22" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f7fc" media="(prefers-color-scheme: light)" />
    <script>
      // Apply the saved (or system) theme before first paint — no flash.
      (() => {
        let theme = 'dark';
        try {
          const saved = localStorage.getItem('kstar-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
          else if (window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
